<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SchoolStack OG card source</title>
<!-- Netlify publishes the repo root, so this template is reachable over HTTP.
     It is a rendering source, not a page - keep it out of the index. -->
<meta name="robots" content="noindex, nofollow">
<!-- The site's own self-hosted fonts, by relative path. This template used to
     pull from fonts.googleapis.com, which the render sandbox cannot reach: the
     fetch failed silently, Chromium fell back to DejaVu Sans, and an off-brand
     card shipped. Local files cannot fail that way. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Brand tokens - kept in sync with the :root block in index.html */
  :root {
    --ink:     #141E33;
    --body:    #475569;
    --sky:     #38BDF8;
    --emerald: #34D399;
    --amber:   #F59E0B;
  }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    overflow: hidden;
    /* Light and warm rather than the dark navy of the site chrome: a share
       card is a first impression, and this one has to feel welcoming. */
    background: linear-gradient(135deg, #FFFFFF 0%, #F0F9FF 45%, #ECFDF5 100%);
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Absolute anchors rather than flex: the card is a fixed 1200x630 canvas, so
     pinning each block to its edge keeps the composition stable no matter how
     the headline wraps. */
  .logo {
    position: absolute;
    top: 64px; left: 78px;
    width: 360px; height: auto;
    display: block;
  }

  .mark {
    position: absolute;
    right: 70px;
    top: 50%;
    transform: translateY(-50%);
    width: 230px;
    opacity: 0.5;
  }

  .content {
    position: absolute;
    left: 78px;
    top: 50%;
    transform: translateY(-44%);
    max-width: 800px;
  }

  h1 {
    font-family: 'Quicksand', system-ui, sans-serif;
    font-weight: 700;
    font-size: 58px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  /* The turn of the headline, carried in brand amber. */
  h1 em { font-style: normal; color: var(--amber); }

  .sub {
    margin-top: 20px;
    font-size: 26px;
    line-height: 1.45;
    color: var(--body);
    max-width: 720px;
  }

  /* Trust and no-risk signals, the two things that actually earn the click. */
  .chips {
    position: absolute;
    left: 78px; bottom: 60px;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  .chip {
    font-size: 19px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 999px;
    background: rgba(20, 30, 51, 0.06);
    color: #334155;
  }
  .chip.hi { background: var(--amber); color: #3B2503; }

  .bars { display: flex; align-items: center; gap: 7px; margin-right: 6px; }
  .bars span { display: block; height: 10px; border-radius: 5px; }
  .bars span:nth-child(1) { width: 26px; background: var(--sky); }
  .bars span:nth-child(2) { width: 36px; background: var(--emerald); }
  .bars span:nth-child(3) { width: 46px; background: var(--amber); }
</style>
</head>
